name: Build Debug APK

on:
  push:
    branches: [feat/memory-list-action]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'GSEOF'
          {
            "project_info": {"project_number": "0", "project_id": "dummy", "storage_bucket": "dummy.appspot.com"},
            "client": [{"client_info": {"mobilesdk_app_id": "1:0:android:dummy", "android_client_info": {"package_name": "me.rerere.rikkahub"}}, "api_key": [{"current_key": "dummy"}]}, {"client_info": {"mobilesdk_app_id": "1:0:android:dummy2", "android_client_info": {"package_name": "me.rerere.rikkahub.debug"}}, "api_key": [{"current_key": "dummy"}]}],
            "configuration_version": "1"
          }
          GSEOF

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: rikkahub-debug
          path: app/build/outputs/apk/debug/*.apk
